<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manifest — Inbound &amp; Outbound Operations</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --ink:#10161f;
  --ink-mid:#3d4653;
  --ink-soft:#5a6472;
  --paper:#f4f3ef;
  --card:#ffffff;
  --line:#dedad0;
  --line-2:#cbc6b8;
  --navy:#0e2436;
  --navy-soft:#2b5375;
  --rose:#a83549;   --rose-bg:#fae7ea;
  --rust:#b8651c;   --rust-bg:#fbeada;
  --teal:#1f6f63;   --teal-bg:#dcefec;
  --moss:#3f6c31;   --moss-bg:#e6f0e1;
  --gray-bg:#e9e7df;
  --signal:#e0952b;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{
  font-family:'Archivo',system-ui,sans-serif;
  font-size:16px;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
button{font-family:'Archivo',sans-serif;}
a{color:inherit;}

.cnum{
  font-family:'JetBrains Mono',monospace;
  font-weight:700;
  font-size:21px;
  letter-spacing:.055em;
  color:var(--ink);
  font-feature-settings:"zero" 1, "ss01" 1;
  line-height:1.1;
  white-space:nowrap;
}
.cnum.sm{font-size:18px;}
.size-tag{
  font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;
  color:var(--ink-soft);background:var(--gray-bg);padding:3px 8px;border-radius:6px;white-space:nowrap;
}

/* ============ Header ============ */
.hdr{background:var(--navy);color:#fff;padding:0 24px;}
.hdr-top{display:flex;align-items:center;gap:16px;padding:18px 0 14px;flex-wrap:wrap;}
.logo{font-weight:800;font-size:25px;letter-spacing:.02em;display:flex;align-items:center;gap:10px;}
.logo .mark{display:inline-flex;width:30px;height:30px;border-radius:7px;background:var(--signal);color:var(--navy);align-items:center;justify-content:center;font-size:16px;font-weight:800;}
.hdr-date{font-family:'JetBrains Mono',monospace;font-size:13.5px;font-weight:500;color:#9fb6c9;letter-spacing:.03em;}
.sync-dot{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:#bcd0e0;}
.sync-dot i{width:8px;height:8px;border-radius:50%;background:#4fae7a;display:inline-block;}
.sync-dot.err i{background:#ff7a7a;}
.sync-dot.err{color:#ffb4b4;}
.hdr-spacer{flex:1;}
.hdr-stats{display:flex;gap:24px;}
.hstat{text-align:right;}
.hstat .v{font-size:29px;font-weight:800;line-height:1;}
.hstat .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.09em;color:#9fb6c9;margin-top:5px;font-weight:600;}
.hstat.warn .v{color:#ff9c9c;}

.mode-row{display:flex;align-items:center;gap:14px;padding:0 0 12px;flex-wrap:wrap;}
.mode-switch{display:flex;background:rgba(255,255,255,.08);border-radius:11px;padding:4px;gap:2px;}
.mode-switch button{
  border:none;background:none;color:#a6bcd0;font-size:15px;font-weight:800;padding:9px 18px;
  border-radius:8px;cursor:pointer;letter-spacing:.02em;
}
.mode-switch button.on{background:var(--signal);color:var(--navy);}
.mode-div{width:1.5px;align-self:stretch;background:rgba(255,255,255,.15);}
.tabs{display:flex;gap:3px;}
.tab{background:none;border:none;color:#a6bcd0;font-size:15.5px;font-weight:700;padding:11px 16px;cursor:pointer;border-bottom:3px solid transparent;}
.tab:hover{color:#fff;}
.tab.on{color:#fff;border-bottom-color:var(--signal);}

.err-banner{background:var(--rose-bg);color:var(--rose);font-size:14.5px;font-weight:700;padding:12px 24px;border-bottom:1.5px solid var(--rose);}

/* ============ Controls ============ */
.controls{display:flex;gap:11px;padding:15px 24px;align-items:center;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--paper);position:sticky;top:0;z-index:10;}
.search-wrap{position:relative;flex:1;min-width:220px;max-width:380px;}
.search-wrap svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--ink-soft);}
input[type=text],input[type=date],select,textarea{
  font-family:'Archivo',sans-serif;font-size:16px;font-weight:500;color:var(--ink);
  border:1.5px solid var(--line-2);border-radius:9px;background:#fff;padding:10px 12px;
}
input:focus,select:focus,textarea:focus{outline:2.5px solid var(--navy-soft);outline-offset:-1px;border-color:transparent;}
.search-wrap input{width:100%;padding-left:38px;}
select{cursor:pointer;}
.chip{
  border:1.5px solid var(--line-2);background:#fff;color:var(--ink-mid);border-radius:22px;
  padding:8px 15px;font-size:14.5px;font-weight:700;cursor:pointer;
  display:inline-flex;align-items:center;gap:7px;user-select:none;
}
.chip:hover{border-color:var(--ink-soft);}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.chip .dot{width:9px;height:9px;border-radius:50%;}
.chip .n{opacity:.65;font-weight:600;}
.spacer{flex:1;}
.btn{border:none;border-radius:9px;padding:11px 17px;font-size:15.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:filter .12s;}
.btn:hover{filter:brightness(.93);}
.btn-primary{background:var(--navy);color:#fff;}
.btn-ghost{background:#fff;color:var(--navy);border:1.5px solid var(--line-2);}
.btn:disabled{opacity:.5;cursor:not-allowed;}

/* ============ Shared ============ */
.type-pill{font-size:12.5px;font-weight:800;padding:4px 11px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.type-a{background:var(--rust-bg);color:var(--rust);}
.type-b{background:#dce7f1;color:var(--navy-soft);}
.status-flag{font-size:13px;font-weight:800;padding:5px 12px;border-radius:7px;text-transform:uppercase;letter-spacing:.05em;white-space:nowrap;}
.overdue-tag{font-size:12px;font-weight:800;color:#fff;background:var(--rose);padding:4px 10px;border-radius:6px;text-transform:uppercase;letter-spacing:.05em;}
.adv-btn{
  border:1.5px solid var(--line-2);background:#fff;color:var(--ink);font-size:14px;font-weight:700;
  padding:8px 13px;border-radius:8px;cursor:pointer;white-space:nowrap;
}
.adv-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy);}
.icon-btn{border:none;background:transparent;cursor:pointer;color:var(--ink-soft);padding:8px;border-radius:8px;display:inline-flex;}
.icon-btn:hover{background:var(--gray-bg);color:var(--ink);}
.note-txt{color:var(--ink-mid);font-size:15px;}
.fwd-txt{color:var(--ink-soft);font-size:13.5px;font-weight:600;}
.empty{text-align:center;padding:80px 20px;color:var(--ink-soft);}
.empty h3{color:var(--ink);margin:0 0 8px;font-size:22px;font-weight:700;}
.empty p{font-size:16px;}
.view{padding:22px 24px 70px;}
.hint{font-size:14px;color:var(--ink-soft);}

.clip{
  display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:800;
  color:var(--teal);background:var(--teal-bg);padding:4px 10px;border-radius:7px;white-space:nowrap;cursor:pointer;
}
.clip:hover{filter:brightness(.95);}

.date-cell{
  font-family:'JetBrains Mono',monospace;font-size:16.5px;font-weight:700;color:var(--ink);
  background:transparent;border:1.5px solid transparent;border-radius:8px;padding:6px 10px;
  cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;
}
.date-cell:hover{border-color:var(--line-2);background:#fff;}
.date-cell .cal{color:var(--ink-soft);display:inline-flex;}
.date-cell.unset{color:var(--ink-soft);font-weight:600;}

.pop-backdrop{position:fixed;inset:0;z-index:70;}
.pop{
  position:fixed;z-index:71;background:#fff;border:1.5px solid var(--line-2);border-radius:12px;
  box-shadow:0 14px 40px rgba(16,22,31,.22);padding:16px;width:300px;
}
.pop h4{margin:0 0 12px;font-size:15px;font-weight:800;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);}
.pop label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin:0 0 5px;text-transform:uppercase;letter-spacing:.05em;}
.pop input{width:100%;}
.pop .quick{display:flex;gap:7px;margin:12px 0;flex-wrap:wrap;}
.pop .quick button{
  border:1.5px solid var(--line-2);background:#fff;border-radius:8px;padding:7px 11px;
  font-size:13.5px;font-weight:700;cursor:pointer;color:var(--ink);
}
.pop .quick button:hover{background:var(--gray-bg);}
.pop .pop-f{display:flex;justify-content:space-between;gap:9px;margin-top:14px;}

/* ============ Schedule ============ */
.day-group{margin-bottom:32px;}
.day-head{display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
.day-title{font-size:21px;font-weight:800;letter-spacing:-.01em;}
.day-count{font-size:14.5px;color:var(--ink-soft);font-weight:600;}
.day-head.danger .day-title{color:var(--rose);}
.sched-list{display:flex;flex-direction:column;gap:10px;border-left:4px solid var(--line);padding-left:18px;margin-left:6px;}
.day-group.danger .sched-list{border-left-color:var(--rose);}
.day-group.today .sched-list{border-left-color:var(--signal);}
.sched-row{
  background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:16px 18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;box-shadow:0 1px 3px rgba(16,22,31,.06);cursor:pointer;
}
.sched-row:hover{border-color:var(--line-2);}
.sched-row.done{opacity:.55;}
.sched-cust{font-weight:700;font-size:19px;min-width:150px;letter-spacing:-.01em;}
.sched-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.grow{flex:1;min-width:90px;}

/* ============ Board ============ */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;align-items:start;}
.col-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;font-size:16.5px;font-weight:800;}
.col-head .cnt{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--ink-soft);font-weight:600;}
.col-cards{display:flex;flex-direction:column;gap:11px;}
.card{background:var(--card);border:1.5px solid var(--line);border-top:5px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:0 1px 3px rgba(16,22,31,.06);cursor:pointer;}
.card:hover{border-color:var(--line-2);}
.card .row1{display:flex;justify-content:space-between;align-items:center;gap:9px;margin-bottom:9px;flex-wrap:wrap;}
.card .cust{font-weight:700;font-size:17px;margin-bottom:8px;}
.card .meta{display:flex;gap:9px;flex-wrap:wrap;align-items:center;font-size:14.5px;color:var(--ink-mid);margin-bottom:10px;}
.card .foot{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap;}

/* ============ Table ============ */
table.grid{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 3px rgba(16,22,31,.07);}
.grid thead th{
  text-align:left;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);
  font-weight:800;padding:14px 16px;border-bottom:2px solid var(--line);background:#faf9f5;white-space:nowrap;cursor:pointer;user-select:none;
}
.grid thead th:hover{color:var(--ink);}
.grid thead th .arr{font-size:10px;margin-left:4px;}
.grid tbody td{padding:16px;border-bottom:1.5px solid var(--line);font-size:16px;vertical-align:middle;}
.grid tbody tr{cursor:pointer;}
.grid tbody tr:hover{background:#faf8f2;}
.grid tbody tr:last-child td{border-bottom:none;}
.grid tbody tr.late{box-shadow:inset 5px 0 0 var(--rose);}

/* ============ Insights ============ */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:26px;}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:20px 22px;}
.stat .v{font-size:44px;font-weight:800;line-height:1;letter-spacing:-.02em;}
.stat .l{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin-top:9px;font-weight:700;}
.panel-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:22px 24px;margin-bottom:18px;}
.panel-card h3{font-size:18px;font-weight:800;margin:0 0 18px;}
.bar-row{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
.bar-row .bl{width:170px;font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right;}
.bar-row .bt{flex:1;background:var(--gray-bg);border-radius:6px;height:24px;overflow:hidden;}
.bar-row .bf{height:100%;background:var(--navy-soft);border-radius:6px;min-width:3px;display:block;}
.bar-row .bn{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:700;color:var(--ink-mid);width:42px;}
.split{display:flex;height:36px;border-radius:9px;overflow:hidden;font-size:14.5px;font-weight:800;color:#fff;}
.split div{display:flex;align-items:center;justify-content:center;min-width:52px;}
.legend{display:flex;gap:20px;margin-top:12px;font-size:14.5px;color:var(--ink-mid);font-weight:600;flex-wrap:wrap;}
.legend span{display:inline-flex;align-items:center;gap:7px;}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block;}

/* ============ Slide-over ============ */
.overlay{position:fixed;inset:0;background:rgba(14,22,32,.45);display:flex;justify-content:flex-end;z-index:50;}
.panel{width:480px;max-width:96vw;background:#fff;height:100%;display:flex;flex-direction:column;box-shadow:-8px 0 30px rgba(0,0,0,.2);animation:slidein .15s ease-out;}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.panel-h{padding:20px 24px;border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.panel-h h2{font-size:21px;font-weight:800;margin:0;}
.panel-b{padding:22px 24px;overflow-y:auto;flex:1;}
.panel-f{padding:17px 24px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;gap:11px;}
.panel-f .right{display:flex;gap:11px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em;}
.field input,.field select,.field textarea{width:100%;}
.field textarea{resize:vertical;min-height:70px;}
.row2{display:flex;gap:12px;}
.row2 .field{flex:1;}
.seg{display:flex;border:1.5px solid var(--line-2);border-radius:9px;overflow:hidden;}
.seg button{flex:1;border:none;background:#fff;padding:11px 6px;font-size:14.5px;font-weight:700;cursor:pointer;color:var(--ink-soft);}
.seg button.on-a{background:var(--rust-bg);color:var(--rust);}
.seg button.on-b{background:#dce7f1;color:var(--navy-soft);}

.attach-box{border:1.5px solid var(--line);border-radius:11px;padding:15px;background:#fbfaf7;}
.attach-list{display:flex;flex-direction:column;gap:9px;margin-bottom:12px;}
.attach-item{display:flex;align-items:center;gap:11px;background:#fff;border:1.5px solid var(--line);border-radius:9px;padding:11px 13px;}
.attach-item .nm{flex:1;font-size:15px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.attach-item .sz{font-family:'JetBrains Mono',monospace;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
.attach-empty{font-size:14.5px;color:var(--ink-soft);margin-bottom:12px;}
.file-label{
  display:inline-flex;align-items:center;gap:8px;border:1.5px dashed var(--line-2);border-radius:9px;
  padding:11px 16px;font-size:15px;font-weight:700;cursor:pointer;color:var(--navy);background:#fff;
}
.file-label:hover{background:var(--gray-bg);}
.file-label.cam{border-style:solid;border-color:var(--teal);color:var(--teal);background:var(--teal-bg);}
.file-label.cam:hover{filter:brightness(.96);background:var(--teal-bg);}
.file-label input{display:none;}
.attach-actions{display:flex;gap:9px;flex-wrap:wrap;}
.attach-sublabel{font-size:11.5px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em;margin:2px 0 9px;}
.photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;margin-bottom:14px;}
.photo-thumb{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1.5px solid var(--line);cursor:pointer;background:var(--gray-bg);}
.photo-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
.photo-thumb .rm{position:absolute;top:4px;right:4px;background:rgba(16,22,31,.72);color:#fff;border:none;border-radius:6px;width:24px;height:24px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.photo-thumb .rm:hover{background:var(--rose);}
.photo-thumb .dl{position:absolute;bottom:0;left:0;right:0;background:rgba(16,22,31,.62);color:#fff;font-size:10.5px;font-weight:700;padding:3px 6px;text-align:center;opacity:0;transition:opacity .12s;}
.photo-thumb:hover .dl{opacity:1;}

/* ============ Import modal ============ */
.modal-ov{position:fixed;inset:0;background:rgba(14,22,32,.5);display:flex;align-items:center;justify-content:center;z-index:60;padding:16px;}
.modal{background:#fff;border-radius:16px;width:620px;max-width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.26);}
.modal-h{padding:20px 24px;border-bottom:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
.modal-h h2{font-size:20px;font-weight:800;margin:0;}
.modal-b{padding:20px 24px;overflow-y:auto;}
.modal-b p{font-size:15px;color:var(--ink-mid);line-height:1.6;margin:0 0 14px;}
.modal-f{padding:16px 24px;border-top:1.5px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
.paste-zone{border:2px dashed var(--line-2);border-radius:11px;padding:28px;text-align:center;font-size:16px;font-weight:600;color:var(--ink-soft);cursor:text;outline:none;}
.paste-zone:focus{border-color:var(--navy-soft);}
.paste-zone.filled{border-style:solid;border-color:var(--teal);background:var(--teal-bg);color:var(--teal);font-weight:700;}
.import-prev{margin-top:15px;border:1.5px solid var(--line);border-radius:11px;overflow:auto;max-height:270px;}
.import-prev table{width:100%;border-collapse:collapse;}
.import-prev th{position:sticky;top:0;background:#faf9f5;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-soft);padding:9px 11px;text-align:left;border-bottom:1.5px solid var(--line);font-weight:800;}
.import-prev td{padding:9px 11px;font-size:14px;border-bottom:1px solid var(--line);white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis;}
.import-more{font-size:14px;color:var(--ink-soft);padding:10px 11px;font-weight:600;}

::placeholder{color:#a5a094;font-weight:500;}
@media(max-width:1000px){.board{grid-template-columns:repeat(2,1fr);}}
@media(max-width:700px){
  .board{grid-template-columns:1fr;}
  .view{padding:16px 12px 60px;}
  .hdr{padding:0 14px;}
  .controls{padding:12px 14px;}
  .hdr-stats{gap:16px;}
  .hstat .v{font-size:23px;}
  .row2{flex-direction:column;}
  .bar-row .bl{width:110px;font-size:14px;}
  .cnum{font-size:19px;}
}
</style>
</head>
<body>
<div id="root"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getStorage, ref, uploadBytes, getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

/* ================= Firebase ================= */
const firebaseConfig = {
  apiKey: "AIzaSyAjYSQKIW-Msh9VLMm4ZaOsRTWZ-T7t6vQ",
  authDomain: "jct-inbound-tracker.firebaseapp.com",
  projectId: "jct-inbound-tracker",
  storageBucket: "jct-inbound-tracker.firebasestorage.app",
  messagingSenderId: "310403363155",
  appId: "1:310403363155:web:c7d58b565ab6aa606971a6"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const storageRef = getStorage(fbApp);

/* ================= entity config =================
   Everything that differs between Inbound and Outbound lives here.
   Inbound's field names (customer, container, size, scheduled, cartons,
   type, skus, note, status, forwarder) are unchanged from the original
   version, so existing Firestore data and the Google Sheet import both
   keep working exactly as before. Outbound is a brand-new collection
   with its own field names, entered directly in the app. */
const ENTITIES = {
  inbound: {
    label:'Inbound', plural:'containers', collection:'containers',
    numberField:'container', numberLabel:'Container #', numberPlaceholder:'e.g. BSIU9959987',
    dateField:'scheduled', dateLabel:'Delivery date',
    methodField:'type', methodLabel:'Unload type',
    methodOptions:[['live','Live unload'],['drop','Drop']],

/* ================= record accessors (mode-aware) ================= */
function numOf(r){ return r[cfg().numberField]; }
function dateOf(r){ return r[cfg().dateField]; }
function methodOf(r){ return r[cfg().methodField]; }
function extraOf(r){ return r[cfg().extraField]; }
function tagOf(r){ return r[cfg().tagField]; }
function methodLabelFor(val){
  const o = cfg().methodOptions.find(o=>o[0]===val);
  return o ? o[1] : val;
}

/* ================= helpers ================= */
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){
  return (s===undefined||s===null?'':String(s))
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function parseLooseDate(str){
  if(!str) return null;
  const m = String(str).match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(!m) return null;
  const d = new Date(+m[3], +m[1]-1, +m[2]);
  return isNaN(d.getTime()) ? null : d;
}
function timePart(str){
  if(!str) return '';
  const m = String(str).match(/\d{1,2}\/\d{1,2}\/\d{4}\s*(.*)$/);
  return m && m[1] ? m[1].trim() : '';
}
function toISO(str){
  const d = parseLooseDate(str);
  if(!d) return '';
  const p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
}
function fromISO(iso){
  if(!iso) return '';
  const m = iso.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return '';
  return `${+m[2]}/${+m[3]}/${+m[1]}`;
}
function today0(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function isOverdue(r){
  const d = parseLooseDate(dateOf(r));
  return !!d && d < today0() && cfg().lateStatuses.includes(r.status);
}
function isActive(r){ return r.status !== cfg().finalStatus; }
function dayLabel(d){
  const diff = Math.round((d - today0())/86400000);
  const w = d.toLocaleDateString('en-US',{weekday:'long'});
  const md = d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  let extra='';
  if(diff===0) extra=' · Today'; else if(diff===1) extra=' · Tomorrow';
  return {title:`${w}, ${md}${extra}`, isToday:diff===0};
}
function normalizeStatus(s, order){
  s=(s||'').toLowerCase();
  for(const key of order) if(s.includes(key.slice(0,4))) return key;
  return order[0];
}
function fmtSize(b){
  if(b<1024) return b+' B';
  if(b<1048576) return (b/1024).toFixed(0)+' KB';
  return (b/1048576).toFixed(1)+' MB';
}
function attCount(r){ return (r.attachments||[]).length; }

/* ================= Firestore sync =================
   Both collections are always listened to (not just the active mode's),
   so switching the Inbound/Outbound pill is instant with no reload. */
function startSync(){
  onSnapshot(collection(db,'containers'), snap => {
    const rows = []; snap.forEach(d => rows.push({...d.data(), id:d.id}));
    state.inbound = rows; state.loadedInbound = true; state.syncError = '';
    if(!state.showForm && !state.showImport && !state.datePop) render();
  }, err => { state.loadedInbound = true; state.syncError = err.message || 'Could not connect to the database.'; render(); });

  onSnapshot(collection(db,'outbound'), snap => {
    const rows = []; snap.forEach(d => rows.push({...d.data(), id:d.id}));
    state.outbound = rows; state.loadedOutbound = true; state.syncError = '';
    if(!state.showForm && !state.showImport && !state.datePop) render();
  }, err => { state.loadedOutbound = true; state.syncError = err.message || 'Could not connect to the database.'; render(); });
}
async function createRecord(mode, data){
  const id = uid();
  await setDoc(doc(db, ENTITIES[mode].collection, id), {...data, attachments:[]});
  return id;
}
async function patchRecord(mode, id, patch){
  await updateDoc(doc(db, ENTITIES[mode].collection, id), patch);
}
async function removeRecord(mode, id){
  await deleteDoc(doc(db, ENTITIES[mode].collection, id));
}
async function bulkCreate(mode, records){
  const c = ENTITIES[mode].collection;
  for(let i=0;i<records.length;i+=400){
    const chunk = records.slice(i,i+400);
    const batch = writeBatch(db);
    chunk.forEach(r=>{ const {id, ...rest} = r; batch.set(doc(db,c,id), rest); });
    await batch.commit();
  }
}

/* ================= Storage (attachments) ================= */
async function uploadAttachment(mode, recordId, file){
  const aid = uid();
  const path = `attachments/${mode}/${recordId}/${aid}_${file.name}`;
  const sref = ref(storageRef, path);
  await uploadBytes(sref, file);
  const url = await getDownloadURL(sref);
  return {id:aid, name:file.name, size:file.size, type:file.type||'', url, path};
}
async function deleteAttachmentFile(path){
  try{ await deleteObject(ref(storageRef, path)); }catch(e){ /* already gone is fine */ }
}
async function purgeAttachments(r){
  for(const a of (r.attachments||[])) await deleteAttachmentFile(a.path);
}

function parseHtmlTable(html){
  const d = new DOMParser().parseFromString(html,'text/html');
  return Array.from(d.querySelectorAll('tr')).map(tr =>
    Array.from(tr.querySelectorAll('td,th')).map(td =>
      td.textContent.replace(/\u00a0/g,' ').replace(/\s+/g,' ').trim()));
}
function parsePastedRows(cd){
  const html = cd.getData('text/html');
  let rows = [];
  if(html && /<table/i.test(html)) rows = parseHtmlTable(html);
  else rows = cd.getData('text/plain').split(/\r?\n/).filter(l=>l.length).map(l=>l.split('\t'));
  if(rows.length && /customer/i.test(rows[0][0]||'')) rows.shift();
  return rows.filter(r => r.some(c => (c||'').trim()));
}
function rowsToContainers(rows){
  return rows.map(cols => ({
    id:uid(),
    customer:(cols[0]||'').trim(),
    container:(cols[1]||'').trim().toUpperCase(),
    size:(cols[2]||"40'HQ").trim(),
    scheduled:(cols[3]||'').trim(),
    cartons:(cols[4]||'').trim(),
    type:(cols[5]||'').toLowerCase().includes('drop') ? 'drop' : 'live',
    skus:(cols[6]||'').trim(),
    note:(cols[7]||'').trim(),
    status:normalizeStatus(cols[8], ENTITIES.inbound.statusOrder),
    forwarder:(cols[9]||'').trim(),
    attachments:[],
  })).filter(r => r.customer || r.container);
}

/* ================= one-time migration from the Claude-only prototype (Inbound only) ================= */
async function migrateFromClaude(){
  if(!window.storage) return;
  if(!confirm('This copies the container data saved earlier in this Claude conversation into the online database. Continue?')) return;
  state.migrating = true; state.migrateMsg = 'Reading local data…'; render();
  let old = [];
  try{
    const res = await window.storage.get('containers', true);
    old = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){}
  if(!old.length){
    state.migrating = false; render();
    alert('No local data found to migrate.');
    return;
  }
  await bulkCreate('inbound', old.map(c => ({...c, attachments:[]})));
  state.migrateMsg = `Saved ${old.length} containers. Migrating files…`; render();

  let fileCount = 0;
  for(const c of old){
    const metas = [];
    for(const a of (c.attachments||[])){
      try{
        const r = await window.storage.get(`attach:${c.id}:${a.id}`, true);
        if(r && r.value){
          const blob = await (await fetch(r.value)).blob();
          const path = `attachments/inbound/${c.id}/${a.id}_${a.name}`;
          const sref = ref(storageRef, path);
          await uploadBytes(sref, blob);
          const url = await getDownloadURL(sref);
          metas.push({id:a.id, name:a.name, size:a.size, type:a.type||'', url, path});
          fileCount++;
          state.migrateMsg = `Migrating files… (${fileCount})`; render();
        }
      }catch(e){}
    }
    if(metas.length) await patchRecord('inbound', c.id, {attachments: metas});
  }
  state.migrating = false; render();
  alert(`Migrated ${old.length} container(s) and ${fileCount} file(s).`);
}

/* ================= filtering ================= */
function getFiltered(){
  let l = list().slice();
  if(state.statusFilter==='active') l = l.filter(isActive);
  else if(state.statusFilter!=='all') l = l.filter(r=>r.status===state.statusFilter);
  if(state.methodFilter!=='all') l = l.filter(r=>methodOf(r)===state.methodFilter);
  const q = state.search.trim().toLowerCase();
  if(q) l = l.filter(r =>
    (r.customer||'').toLowerCase().includes(q) ||
    (numOf(r)||'').toLowerCase().includes(q) ||
    (r.note||'').toLowerCase().includes(q) ||
    (tagOf(r)||'').toLowerCase().includes(q) ||
    (r.skus||'').toLowerCase().includes(q));
  return l;
}
function sortList(l){
  const {key,dir} = state.sort;
  const c = cfg();
  return l.slice().sort((a,b)=>{
    if(key==='date'){
      const da=parseLooseDate(dateOf(a)), db2=parseLooseDate(dateOf(b));
      if(!da&&!db2) return 0; if(!da) return 1; if(!db2) return -1;
      return (da-db2)*dir;
    }
    if(key==='status') return (c.statusMeta[a.status].order - c.statusMeta[b.status].order)*dir;
    if(key==='cartons') return ((parseFloat(a.cartons)||0)-(parseFloat(b.cartons)||0))*dir;
    if(key==='number') return String(numOf(a)||'').localeCompare(String(numOf(b)||''))*dir;
    return String(a[key]||'').localeCompare(String(b[key]||''))*dir;
  });
}

/* ================= schedule ================= */
function scheduleHtml(l){
  if(!l.length) return emptyHtml();
  const late = l.filter(isOverdue);
  const rest = l.filter(r=>!isOverdue(r));
  const dated={}, undated=[];
  rest.forEach(r=>{
    const d = parseLooseDate(dateOf(r));
    if(!d){ undated.push(r); return; }
    (dated[d.getTime()] = dated[d.getTime()]||[]).push(r);
  });
  let out='';
  if(late.length) out += dayGroup('Overdue', late, 'danger');
  Object.keys(dated).map(Number).sort((a,b)=>a-b).forEach(k=>{
    const {title,isToday} = dayLabel(new Date(k));
    out += dayGroup(title, dated[k], isToday?'today':'');
  });
  if(undated.length) out += dayGroup('Not yet scheduled', undated, '');
  return out;
}
function dayGroup(title, rows, cls){
  return `
  <div class="day-group ${cls}">
    <div class="day-head ${cls==='danger'?'danger':''}">
      <span class="day-title">${title}</span>
      <span class="day-count">${rows.length} ${rows.length===1?cfg().plural.replace(/s$/,''):cfg().plural}</span>
    </div>
    <div class="sched-list">${rows.map(schedRow).join('')}</div>
  </div>`;
}
function schedRow(r){
  const c = cfg();
  const nxt = c.nextStatus[r.status], meta = c.statusMeta[r.status];
  return `
  <div class="sched-row ${r.status===c.finalStatus?'done':''}" data-action="edit" data-id="${r.id}">

/* ================= insights ================= */
function insightsHtml(){
  const c = cfg();
  const all = list();
  if(!all.length) return emptyHtml();
  const active = all.filter(isActive);
  const late = all.filter(isOverdue);
  const t=today0(), wk=new Date(t); wk.setDate(wk.getDate()+7);
  const soon = active.filter(r=>{const d=parseLooseDate(dateOf(r));return d&&d>=t&&d<wk;});
  const mo = new Date(t.getFullYear(), t.getMonth(), 1);
  const doneMo = all.filter(r=>{const d=parseLooseDate(dateOf(r));return r.status===c.finalStatus&&d&&d>=mo;});
  const missingDocs = active.filter(r=>!attCount(r)).length;
  const byCust={};
  active.forEach(r=>{const k=r.customer||'(unknown)'; byCust[k]=(byCust[k]||0)+1;});
  const top = Object.entries(byCust).sort((a,b)=>b[1]-a[1]).slice(0,8);
  const max = top.length?top[0][1]:1;
  const first = active.filter(r=>methodOf(r)===c.methodOptions[0][0]).length;
  const second = active.length-first;
  const fp = active.length?Math.round(first/active.length*100):0;
  return `
  <div class="stats">
    <div class="stat"><div class="v">${active.length}</div><div class="l">Active ${c.plural}</div></div>
    <div class="stat"><div class="v">${soon.length}</div><div class="l">Due next 7 days</div></div>
    <div class="stat"><div class="v" style="color:${late.length?'var(--rose)':'inherit'}">${late.length}</div><div class="l">Overdue</div></div>
    <div class="stat"><div class="v">${doneMo.length}</div><div class="l">${c.statusMeta[c.finalStatus].label} this month</div></div>
    <div class="stat"><div class="v" style="color:${missingDocs?'var(--rust)':'inherit'}">${missingDocs}</div><div class="l">Active, no ${c.attachLabel}</div></div>
  </div>
  <div class="panel-card">
    <h3>Active ${c.plural} by customer</h3>
    ${top.map(([n,v])=>`<div class="bar-row">
      <span class="bl">${esc(n)}</span>
      <span class="bt"><span class="bf" style="width:${Math.round(v/max*100)}%"></span></span>
      <span class="bn">${v}</span></div>`).join('')}
  </div>
  <div class="panel-card">
    <h3>${c.methodLabel} split (active)</h3>
    <div class="split">
      ${first?`<div style="background:var(--rust);flex:${first}">${fp}%</div>`:''}
      ${second?`<div style="background:var(--navy-soft);flex:${second}">${100-fp}%</div>`:''}
    </div>
    <div class="legend">
      <span><i style="background:var(--rust)"></i>${c.methodOptions[0][1]} · ${first}</span>
      <span><i style="background:var(--navy-soft)"></i>${c.methodOptions[1][1]} · ${second}</span>
    </div>
  </div>`;
}

/* ================= render ================= */
function render(){
  const l = getFiltered();
  let body;
  if(!loaded()) body = '<div class="empty"><h3>Connecting…</h3></div>';
  else if(state.view==='schedule') body = scheduleHtml(l);
  else if(state.view==='board') body = boardHtml(l);
  else if(state.view==='insights') body = insightsHtml();
  else body = tableHtml(l);
  document.getElementById('root').innerHTML =
    headerHtml() + controlsHtml() + `<div class="view">${body}</div>` +
    formHtml() + importHtml() + datePopHtml();
  wireInputs();
}
function wireInputs(){
  const s = document.getElementById('searchInput');
  if(s) s.oninput = e => {
    state.search = e.target.value; render();
    const s2 = document.getElementById('searchInput');
    if(s2){ s2.focus(); s2.setSelectionRange(s2.value.length, s2.value.length); }
  };
  const t = document.getElementById('methodSelect');
  if(t) t.onchange = e => { state.methodFilter = e.target.value; render(); };
  const pz = document.getElementById('pasteZone');
  if(pz) pz.addEventListener('paste', e => {
    e.preventDefault();
    state.importRows = parsePastedRows(e.clipboardData || window.clipboardData);
    render();
  });
  const fi = document.getElementById('attInput');
  if(fi) fi.onchange = e => handleFiles(e.target.files);
  const cam = document.getElementById('camInput');
  if(cam) cam.onchange = e => handleFiles(e.target.files);
  const ph = document.getElementById('photoInput');
  if(ph) ph.onchange = e => handleFiles(e.target.files);
  const pd = document.getElementById('popDate');
  if(pd) pd.focus();
}

/* ================= attachments (UI side) ================= */
async function handleFiles(files){
  if(!files || !files.length || !state.editingId) return;
  const mode = state.mode, rid = state.editingId;
  state.uploadError=''; state.uploading=true; render();
  const newMetas = [];
  for(const f of Array.from(files)){
    if(f.size > MAX_FILE){
      state.uploadError = `"${f.name}" is ${fmtSize(f.size)} — the limit is 15 MB per file.`;
      continue;
    }
    try{
      const meta = await uploadAttachment(mode, rid, f);
      newMetas.push(meta);
    }catch(err){
      state.uploadError = `Couldn't upload "${f.name}". Check your connection and try again.`;
    }
  }
  if(newMetas.length){
    const r = list().find(x=>x.id===rid);
    const merged = (r && r.attachments ? r.attachments.slice() : []).concat(newMetas);
    await patchRecord(mode, rid, {attachments: merged});
  }
  state.uploading = false;
  render();
}
function openAttachment(rid, aid){
  const r = list().find(x=>x.id===rid);
  const a = r && (r.attachments||[]).find(x=>x.id===aid);
  if(a && a.url) window.open(a.url, '_blank');
}
async function removeAttachment(rid, aid){
  const r = list().find(x=>x.id===rid);
  if(!r) return;
  if(!confirm('Remove this file?')) return;
  const a = (r.attachments||[]).find(x=>x.id===aid);
  if(a) await deleteAttachmentFile(a.path);
  const remaining = (r.attachments||[]).filter(x=>x.id!==aid);
  await patchRecord(state.mode, rid, {attachments: remaining});
}

/* ================= events ================= */
document.addEventListener('click', e => {
  if(e.target.id==='formOverlay'){ closeForm(); return; }
  if(e.target.id==='importOverlay'){ closeImport(); return; }
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const act = el.dataset.action, id = el.dataset.id, v = el.dataset.v;

  if(act==='set-mode'){
    state.mode=v; state.statusFilter='active'; state.methodFilter='all'; state.search='';
    state.sort={key:'date',dir:1}; state.showForm=false; state.editingId=null; state.showImport=false;
    render();
  }
  else if(act==='set-view'){ state.view=v; render(); }
  else if(act==='set-status'){ state.statusFilter=v; render(); }
  else if(act==='sort'){
    if(state.sort.key===v) state.sort.dir*=-1; else state.sort={key:v,dir:1};
    render();
  }
  else if(act==='new'){ state.showForm=true; state.editingId=null; state.formMethod=cfg().methodOptions[0][0]; state.uploadError=''; render(); }
  else if(act==='edit'){
    const r = list().find(x=>x.id===id);
    state.editingId=id; state.formMethod=r?methodOf(r):cfg().methodOptions[0][0]; state.showForm=true; state.uploadError=''; render();
  }
  else if(act==='open-date'){
    e.stopPropagation();
    const r = el.getBoundingClientRect();
    state.datePop = {id, x:r.left, y:r.bottom+8};
    render();
  }
  else if(act==='close-date'){ state.datePop=null; render(); }
  else if(act==='date-quick'){
    const d = new Date(); d.setDate(d.getDate()+Number(v));
    const p = n=>String(n).padStart(2,'0');
    const inp = document.getElementById('popDate');
    if(inp) inp.value = `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;
  }
  else if(act==='date-save'){
    const targetId = state.datePop.id;
    const iso = (document.getElementById('popDate')||{}).value || '';
    const tm  = ((document.getElementById('popTime')||{}).value || '').trim();
    const base = fromISO(iso);
    const val = base ? (tm ? `${base} ${tm}` : base) : '';
    state.datePop = null;
    patchRecord(state.mode, targetId, {[cfg().dateField]: val});
  }
  else if(act==='date-clear'){
    const targetId = state.datePop.id;
    state.datePop = null;
    patchRecord(state.mode, targetId, {[cfg().dateField]: ''});
  }
  else if(act==='advance'){
    e.stopPropagation();
    const r = list().find(x=>x.id===id);
    const nxt = r && cfg().nextStatus[r.status];
    if(nxt) patchRecord(state.mode, id, {status: nxt});
  }
  else if(act==='del'){
    e.stopPropagation();
    if(confirm(`Delete this ${cfg().plural.replace(/s$/,'')} and its files? This cannot be undone.`)){
      const r = list().find(x=>x.id===id);
      if(r) purgeAttachments(r);
      removeRecord(state.mode, id);
    }
  }
  else if(act==='att-open'){ e.stopPropagation(); openAttachment(id, v); }
  else if(act==='att-del'){ e.stopPropagation(); removeAttachment(id, v); }
  else if(act==='form-method'){
    state.formMethod=v;
    document.querySelectorAll('.seg button').forEach(b=>b.className='');
    el.className = v===cfg().methodOptions[0][0] ? 'on-a' : 'on-b';
  }
  else if(act==='close-form'){ closeForm(); }
  else if(act==='save-form'){ saveForm(); }
  else if(act==='delete-from-form'){
    if(confirm(`Delete this ${cfg().plural.replace(/s$/,'')} and its files? This cannot be undone.`)){
      const r = list().find(x=>x.id===state.editingId);
      if(r) purgeAttachments(r);
      removeRecord(state.mode, state.editingId);
      state.showForm=false; state.editingId=null;
      render();
    }
  }
  else if(act==='import'){ state.showImport=true; state.importRows=[]; render(); }
  else if(act==='close-import'){ closeImport(); }
  else if(act==='clear-paste'){ e.preventDefault(); state.importRows=[]; render(); }
  else if(act==='run-import'){
    if(!state.importRows.length) return;
    bulkCreate('inbound', rowsToContainers(state.importRows));
    state.showImport=false; state.importRows=[];
    render();
  }
  else if(act==='export'){ exportCsv(); }
  else if(act==='migrate'){ migrateFromClaude(); }
});
document.addEventListener('keydown', e => {
  if(e.key!=='Escape') return;
  if(state.datePop){ state.datePop=null; render(); }
  else if(state.showImport) closeImport();
  else if(state.showForm) closeForm();
});

function closeForm(){ state.showForm=false; state.editingId=null; state.uploadError=''; render(); }
function closeImport(){ state.showImport=false; state.importRows=[]; render(); }

async function saveForm(){
  const c = cfg();
  const g = id => (document.getElementById(id)||{}).value || '';
  const base = fromISO(g('f_date'));
  const tm = g('f_time').trim();
  const data = {
    customer:g('f_customer').trim(),
    [c.numberField]: c.numberField==='container' ? g('f_number').trim().toUpperCase() : g('f_number').trim(),
    [c.extraField]:g('f_extra'),
    [c.dateField]: base ? (tm ? `${base} ${tm}` : base) : '',
    cartons:g('f_cartons').trim(),
    [c.methodField]:state.formMethod,
    skus:g('f_skus').trim(),
    status:g('f_status'),
    note:g('f_note').trim(),
    [c.tagField]:g('f_tag').trim(),
  };
  if(!data.customer || !data[c.numberField]){ alert(`Customer and ${c.numberLabel.toLowerCase()} are required.`); return; }
  if(state.editingId){
    await patchRecord(state.mode, state.editingId, data);
    state.showForm=false; state.editingId=null;
    render();
  }else{
    const newId = await createRecord(state.mode, data);
    state.editingId = newId;
    render();
  }
}

function exportCsv(){
  const c = cfg();
  const fieldOrder = ['customer', c.numberField, c.extraField, c.dateField, 'cartons', c.methodField, 'skus', 'note', 'status', c.tagField];
  const q = s => `"${String(s??'').replace(/"/g,'""')}"`;
  const lines=[c.csvHead].concat(list().map(r=>
    fieldOrder.map(k=>q(r[k])).join(',') + ',' + q((r.attachments||[]).map(a=>a.name).join('; '))));
  const blob = new Blob([lines.join('\n')],{type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = c.csvFile;
  a.click();
  URL.revokeObjectURL(a.href);
}

render();
startSync();
</script>
